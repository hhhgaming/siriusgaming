<article class="post">
  <header class="post-head">
    <a class="tag" href="{{category_url}}">{{category}}</a>
    <h1>{{title}}</h1>
    <p class="lead">{{description}}</p>
    <time>{{date}}</time>
  </header>
  {{figure}}
  <div class="post-layout">
    <aside class="side">{{toc}}</aside>
    <div class="prose">{{body}}<div class="disclaimer">{{disclaimer}}</div></div>
  </div>
  <nav class="post-nav">{{newer}}{{older}}</nav>
</article>
<section class="related"><h2>延伸閱讀</h2><div class="grid">{{related}}</div></section>

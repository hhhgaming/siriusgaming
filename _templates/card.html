<article class="card">
  <a class="card-img" href="{{url}}"><img src="{{image}}" alt="{{image_alt}}" loading="lazy"></a>
  <div class="card-body">
    <a class="tag" href="{{category_url}}">{{category}}</a>
    <h2><a href="{{url}}">{{title}}</a></h2>
    <p>{{description}}</p>
    <time>{{date}}</time>
  </div>
</article>
